[build]
  command = "pnpm build:site && cp website/_headers website/dist/_headers"
  publish = "website/dist"

[build.environment]
  NODE_VERSION = "24.21.0"

# Temporary, isolated keyboard comparison artifacts.
[context."codex/keyboard-reorder-inflight"]
  command = "VITE_SCRATCHTREE_REORDER_PREVIEW=1 pnpm build:public-web"
  publish = "public-web-dist"
  functions = { directory = "deploy/web/functions" }
  processing = { html = { pretty_urls = false } }

[context."codex/keyboard-reorder-debounce"]
  command = "VITE_SCRATCHTREE_REORDER_PREVIEW=1 pnpm build:public-web"
  publish = "public-web-dist"
  functions = { directory = "deploy/web/functions" }
  processing = { html = { pretty_urls = false } }

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
